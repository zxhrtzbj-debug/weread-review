        ## 微信读书 · AI 阅读评价

        提取微信读书里的**划线 / 想法 / 书评**，交给大模型生成一份阅读评价报告。

        ### 它长什么样

        1. 扫码登录（或点「🧪 一键体验」用示例数据直接体验）
        2. 选择提取范围（全量 / 只提取书评）
        3. 挑书、设时间范围
        4. 按内容类型筛选，预览省了多少 token
        5. 可选：联网补检冷门书籍
        6. 生成报告

        ### 三分钟上手

        ```bash
        git clone <本仓库>
        cd review_weread
        python3 backend/main.py
        ```

        浏览器会自动打开 `http://127.0.0.1:8777/`。
        不想装 Python 依赖的话不需要——**后端零第三方依赖**，标准库全部搞定。

        ### 它的特别之处

        - **零第三方依赖**：HTTP 层、数据模型、HTTP client 全是自己写的标准库实现
        - **不留痕**：所有状态在内存，磁盘零写入，进程退出即彻底结束
        - **请求数可控**：只提取书评模式下，每本书从 4 次请求降到 2 次
        - **开销可预测**：联网补检是固定五道工序，不让 LLM 参与决策

        ### 想参与？

        - 报 bug / 要功能 → 开 issue
        - 改代码 → 读 [CONTRIBUTING.md](CONTRIBUTING.md)，注意两条硬约定
        - 部署一份自己玩 → 见 README 的「部署」一节

        ### ⚠️ 请注意

        这是一个**个人项目、非官方工具**，与腾讯/微信读书无任何关联。
        它会处理你的微信读书登录 cookie 与 LLM API Key，
        **请勿在不设访问口令的情况下暴露到公网**。详见 [SECURITY.md](SECURITY.md)。
