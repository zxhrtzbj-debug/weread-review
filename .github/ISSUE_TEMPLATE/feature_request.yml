name: 功能建议
description: 提议一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 先说问题，别直接说方案。「我想少点三次鼠标」比「加个批量按钮」更有信息量
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
    validations:
      required: true

  - type: textarea
    id: tradeoff
    attributes:
      label: 你看到的代价
      description: 这会让代码变复杂吗？违反「零第三方依赖」或「routers 不写业务」吗？

  - type: checkboxes
    id: constraints
    attributes:
      label: 我确认过项目的约束
      options:
        - label: 我读过 CONTRIBUTING.md，知道后端要保持零第三方依赖
        - label: 这个改动不需要 playwright
